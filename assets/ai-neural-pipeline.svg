<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="340" style="background: transparent;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#161b22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0d12" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseLine {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeRing {
      0% { r: 6; opacity: 1; }
      100% { r: 16; opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes borderGlow {
      0%, 100% { stroke: #00d4ff; }
      50% { stroke: #7f00ff; }
    }

    .border-anim { animation: borderGlow 6s ease-in-out infinite; }
    .synapse {
      stroke: url(#cyanPurple);
      stroke-width: 1.5;
      stroke-dasharray: 8, 12;
      animation: pulseLine 2.5s linear infinite;
    }
    .synapse-fast {
      stroke: #00d4ff;
      stroke-width: 1.5;
      stroke-dasharray: 6, 16;
      animation: pulseLine 1.8s linear infinite reverse;
    }
    .cursor { animation: blink 0.9s infinite; }
    .ring-pulse { animation: nodeRing 2.4s ease-out infinite; transform-origin: center; }
  </style>

  <!-- Main Container Card -->
  <rect x="5" y="5" width="840" height="330" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.8" class="border-anim" />

  <!-- Background Grid Pattern -->
  <g opacity="0.07" stroke="#00d4ff" stroke-width="1">
    <line x1="20" y1="60" x2="830" y2="60" stroke-dasharray="4,8" />
    <line x1="20" y1="120" x2="830" y2="120" stroke-dasharray="4,8" />
    <line x1="20" y1="180" x2="830" y2="180" stroke-dasharray="4,8" />
    <line x1="20" y1="240" x2="830" y2="240" stroke-dasharray="4,8" />
    <line x1="20" y1="290" x2="830" y2="290" stroke-dasharray="4,8" />
    <line x1="440" y1="20" x2="440" y2="320" stroke-dasharray="4,8" />
  </g>

  <!-- Header Banner -->
  <g>
    <!-- Window buttons -->
    <circle cx="30" cy="28" r="5.5" fill="#ff5f56" />
    <circle cx="48" cy="28" r="5.5" fill="#ffbd2e" />
    <circle cx="66" cy="28" r="5.5" fill="#27c93f" />
    
    <text x="95" y="32" fill="#8b949e" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">
      HARSH-CHOUDHARY // INTELLIGENT AI PIPELINE &amp; ARCHITECTURE
    </text>
    
    <!-- Live Pulse Indicator -->
    <circle cx="790" cy="28" r="4" fill="#00d4ff" filter="url(#subtleGlow)" />
    <circle cx="790" cy="28" r="8" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6" class="ring-pulse" />
    <text x="802" y="32" fill="#00d4ff" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">ONLINE</text>
    
    <line x1="15" y1="46" x2="835" y2="46" stroke="#30363d" stroke-width="1" />
  </g>

  <!-- LEFT: Interactive Terminal Console -->
  <g transform="translate(25, 65)">
    <!-- Terminal Background -->
    <rect x="0" y="0" width="410" height="245" rx="10" fill="#080b0f" stroke="#21262d" stroke-width="1.2" />
    
    <text x="16" y="26" font-family="'Fira Code', 'Courier New', monospace" font-size="12" fill="#58a6ff">
      <tspan fill="#a855f7">harsh@ai-core</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#00d4ff">~/pipeline</tspan><tspan fill="#f0f6fc">$ python run_ai_system.py</tspan>
    </text>
    
    <text x="16" y="58" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#7ee787">
      ✔ [INIT] <tspan fill="#c9d1d9">Deep Learning Stack: PyTorch + CUDA</tspan>
    </text>
    
    <text x="16" y="88" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#7ee787">
      ✔ [CV/NLP] <tspan fill="#c9d1d9">Vision Transformer &amp; LLM embeddings ready</tspan>
    </text>
    
    <text x="16" y="118" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#7ee787">
      ✔ [RAG] <tspan fill="#c9d1d9">Vector DB connected • Milvus / Chroma</tspan>
    </text>

    <text x="16" y="148" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#7ee787">
      ✔ [MLOPS] <tspan fill="#c9d1d9">FastAPI + Docker containerized [0.012s latency]</tspan>
    </text>

    <text x="16" y="178" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#79c0ff">
      ⚡ [METRICS] <tspan fill="#e3b341">Accuracy: 99.4%</tspan> <tspan fill="#8b949e">| F1 Score: 0.99</tspan>
    </text>

    <!-- Active Line -->
    <text x="16" y="214" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#00d4ff">
      &gt; Real-time inference running in production <tspan class="cursor" fill="#00d4ff">_</tspan>
    </text>

    <!-- Small status pill inside terminal -->
    <rect x="285" y="200" width="112" height="22" rx="5" fill="#161b22" stroke="#30363d" />
    <circle cx="297" cy="211" r="3.5" fill="#00d4ff" />
    <text x="307" y="215" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#7ee787">READY TO SHIP</text>
  </g>

  <!-- RIGHT: Animated Neural Network & Synapses -->
  <g transform="translate(460, 65)">
    <!-- Network Header -->
    <text x="30" y="20" fill="#00d4ff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      NEURAL SYNAPSE TOPOLOGY
    </text>
    <text x="30" y="36" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-size="11">
      Multi-Modal Model Flow &amp; Distributed Architecture
    </text>

    <!-- Layer Labels -->
    <text x="35" y="60" fill="#58a6ff" font-family="monospace" font-size="10" font-weight="bold">INPUTS</text>
    <text x="160" y="60" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold">HIDDEN</text>
    <text x="295" y="60" fill="#00d4ff" font-family="monospace" font-size="10" font-weight="bold">DEPLOY</text>

    <!-- Synapses (Lines) between Layer 1 & 2 -->
    <g>
      <line x1="55" y1="95" x2="180" y2="80" class="synapse" />
      <line x1="55" y1="95" x2="180" y2="135" class="synapse" />
      <line x1="55" y1="95" x2="180" y2="190" class="synapse-fast" />
      
      <line x1="55" y1="155" x2="180" y2="80" class="synapse-fast" />
      <line x1="55" y1="155" x2="180" y2="135" class="synapse" />
      <line x1="55" y1="155" x2="180" y2="190" class="synapse" />
      <line x1="55" y1="155" x2="180" y2="245" class="synapse-fast" />

      <line x1="55" y1="215" x2="180" y2="135" class="synapse" />
      <line x1="55" y1="215" x2="180" y2="190" class="synapse-fast" />
      <line x1="55" y1="215" x2="180" y2="245" class="synapse" />

      <!-- L2 to L3 -->
      <line x1="180" y1="80" x2="315" y2="115" class="synapse" />
      <line x1="180" y1="80" x2="315" y2="175" class="synapse-fast" />
      <line x1="180" y1="135" x2="315" y2="115" class="synapse-fast" />
      <line x1="180" y1="135" x2="315" y2="175" class="synapse" />
      <line x1="180" y1="190" x2="315" y2="115" class="synapse" />
      <line x1="180" y1="190" x2="315" y2="175" class="synapse-fast" />
      <line x1="180" y1="190" x2="315" y2="235" class="synapse" />
      <line x1="180" y1="245" x2="315" y2="175" class="synapse" />
      <line x1="180" y1="245" x2="315" y2="235" class="synapse-fast" />
    </g>

    <!-- Layer 1 Nodes (Input: Vision, NLP, Tabular) -->
    <g>
      <circle cx="55" cy="95" r="15" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#subtleGlow)"/>
      <text x="55" y="99" text-anchor="middle" fill="#f0f6fc" font-family="monospace" font-size="10" font-weight="bold">CV</text>

      <circle cx="55" cy="155" r="15" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#subtleGlow)"/>
      <text x="55" y="159" text-anchor="middle" fill="#f0f6fc" font-family="monospace" font-size="9" font-weight="bold">LLM</text>

      <circle cx="55" cy="215" r="15" fill="#161b22" stroke="#58a6ff" stroke-width="2" filter="url(#subtleGlow)"/>
      <text x="55" y="219" text-anchor="middle" fill="#f0f6fc" font-family="monospace" font-size="9" font-weight="bold">DATA</text>
    </g>

    <!-- Layer 2 Nodes (Hidden / Transformers / RAG) -->
    <g>
      <circle cx="180" cy="80" r="13" fill="#161b22" stroke="#a855f7" stroke-width="2" filter="url(#subtleGlow)"/>
      <text x="180" y="83" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="8">H₁</text>

      <circle cx="180" cy="135" r="16" fill="#1f1435" stroke="#a855f7" stroke-width="2.4" filter="url(#glow)"/>
      <text x="180" y="139" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" font-weight="bold">RAG</text>

      <circle cx="180" cy="190" r="16" fill="#1f1435" stroke="#a855f7" stroke-width="2.4" filter="url(#glow)"/>
      <text x="180" y="194" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" font-weight="bold">ViT</text>

      <circle cx="180" cy="245" r="13" fill="#161b22" stroke="#a855f7" stroke-width="2" filter="url(#subtleGlow)"/>
      <text x="180" y="248" text-anchor="middle" fill="#c9d1d9" font-family="monospace" font-size="8">H₄</text>
    </g>

    <!-- Layer 3 Nodes (Output: Deployments & Decision) -->
    <g>
      <circle cx="315" cy="115" r="15" fill="#161b22" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>
      <text x="315" y="119" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" font-weight="bold">API</text>

      <circle cx="315" cy="175" r="17" fill="#0a2233" stroke="#00d4ff" stroke-width="2.5" filter="url(#glow)"/>
      <text x="315" y="179" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="10" font-weight="bold">PROD</text>

      <circle cx="315" cy="235" r="15" fill="#161b22" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>
      <text x="315" y="239" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" font-weight="bold">UIs</text>
    </g>
  </g>
</svg>
